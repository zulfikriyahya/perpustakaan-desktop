name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-amd64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libx11-dev libxtst-dev libxi-dev libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Build RFID Bridge (Linux)
        run: |
          cd rfid_bridge_src
          cargo build --release
          mkdir -p ../src-tauri/binaries
          cp target/release/rfid_bridge ../src-tauri/binaries/rfid_bridge-x86_64-unknown-linux-gnu
          chmod +x ../src-tauri/binaries/rfid_bridge-x86_64-unknown-linux-gnu

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Build
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-build
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  build-windows-64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build RFID Bridge (Windows 64)
        run: |
          cd rfid_bridge_src
          cargo build --release
          New-Item -ItemType Directory -Force -Path ..\src-tauri\binaries
          copy target\release\rfid_bridge.exe ..\src-tauri\binaries\rfid_bridge-x86_64-pc-windows-msvc.exe
        shell: pwsh

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Build
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-64-build
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  build-windows-32:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Build RFID Bridge (Windows 32)
        run: |
          cd rfid_bridge_src
          cargo build --release --target i686-pc-windows-msvc
          New-Item -ItemType Directory -Force -Path ..\src-tauri\binaries
          copy target\i686-pc-windows-msvc\release\rfid_bridge.exe ..\src-tauri\binaries\rfid_bridge-i686-pc-windows-msvc.exe
        shell: pwsh

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Build
        run: npm run tauri build -- --target i686-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: windows-32-build
          path: |
            src-tauri/target/i686-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/i686-pc-windows-msvc/release/bundle/nsis/*.exe

  release:
    needs: [build-linux-amd64, build-windows-64, build-windows-32]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-amd64-build/**
            artifacts/windows-64-build/**
            artifacts/windows-32-build/**
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
