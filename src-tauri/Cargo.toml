[package]
name = "perpustakaan-mtsn1pandeglang"
version = "0.1.0"
description = "Aplikasi desktop untuk mengakses sistem sirkulasi perpustakaan MTsN 1 Pandeglang secara langsung."
authors = ["Yahya Zulfikri"]
edition = "2021"
[lib]
name = "perpustakaan_mtsn1pandeglang_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-shell = "2.3.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["time"] }
# TODO: verifikasi versi persis terhadap Cargo.lock setelah `cargo build` pertama
tauri-plugin-store = "2"
